name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Android SDK and disposable debug signing key
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - run: python scripts/validate-source.py --skip-kotlin
      - name: Build, regression tests and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Check APK uses current compiled code
        run: python scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk --project-dex-dir app/build/intermediates/dex/debug/mergeProjectDexDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefix functions
      - run: npm test --prefix functions
      - run: npm run check --prefix functions
      - name: Reject high and critical dependency advisories
        run: npm audit --omit=dev --audit-level=high --prefix functions
      - name: Firestore security rules in an isolated demo project
        run: npx --yes firebase-tools@15.34.2 emulators:exec --only auth,firestore --project demo-naholosy 'node scripts/run-emulator-tests.mjs'
